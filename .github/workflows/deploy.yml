name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ==============================
  # TEST JOB
  # ==============================
  test:
    name: Test MERN Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check src/server.js


  # ==============================
  # DEPLOY JOB
  # ==============================
  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:

      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout code
        uses: actions/checkout@v4


      # ==============================
      # AWS OIDC
      # ==============================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ==============================
      # VERIFY AWS
      # ==============================
      - name: Verify AWS identity
        run: aws sts get-caller-identity


      # ==============================
      # DEPLOY TO EC2
      # ==============================
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m

          script: |

            set -e

            echo "========================================="
            echo "DEPLOYMENT STARTED"
            echo "Time: $(date)"
            echo "========================================="


            # =================================
            # VARIABLES
            # =================================

            APP_DIR="/var/www/backend"
            TEMP_DIR="/tmp/backend-deploy"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="main"

            echo "Repository: $REPO_URL"
            echo "Branch: $BRANCH"
            echo "Application directory: $APP_DIR"


            # =================================
            # CREATE APPLICATION DIRECTORY
            # =================================

            sudo mkdir -p "$APP_DIR"
            sudo chown -R ubuntu:ubuntu "$APP_DIR"


            # =================================
            # FIRST DEPLOYMENT
            # =================================

            if [ ! -d "$APP_DIR/.git" ]; then

              echo "First deployment detected."

              rm -rf "$TEMP_DIR"

              mkdir -p "$TEMP_DIR"

              echo "Cloning repository..."

              git clone \
                --branch "$BRANCH" \
                --single-branch \
                "$REPO_URL" \
                "$TEMP_DIR"

              echo "Copying project files..."

              cp -a "$TEMP_DIR"/. "$APP_DIR"/

              echo "Removing temporary directory..."

              rm -rf "$TEMP_DIR"

              cd "$APP_DIR"

            else

              # =================================
              # UPDATE EXISTING DEPLOYMENT
              # =================================

              echo "Existing repository found."

              cd "$APP_DIR"

              echo "Fetching latest changes..."

              git fetch origin "$BRANCH"

              echo "Resetting to latest GitHub version..."

              git reset --hard "origin/$BRANCH"

              echo "Removing old untracked files..."

              git clean -fd -e .env

            fi


            # =================================
            # CHECK PROJECT FILES
            # =================================

            echo "========================================="
            echo "PROJECT FILES"
            echo "========================================="

            ls -la


            # =================================
            # CHECK .ENV
            # =================================

            if [ ! -f "$APP_DIR/.env" ]; then

              echo "ERROR: .env file not found!"

              echo "Create /var/www/backend/.env on EC2."

              exit 1

            fi

            echo ".env file found."


            # =================================
            # INSTALL DEPENDENCIES
            # =================================

            echo "========================================="
            echo "INSTALLING DEPENDENCIES"
            echo "========================================="

            npm ci --omit=dev


            # =================================
            # PM2
            # =================================

            echo "========================================="
            echo "STARTING APPLICATION"
            echo "========================================="

            if pm2 describe backend-api > /dev/null 2>&1; then

              echo "Application already running."

              echo "Restarting application..."

              pm2 restart backend-api

            else

              echo "Starting application for the first time."

              pm2 start src/server.js --name backend-api

            fi


            # =================================
            # SAVE PM2
            # =================================

            echo "Saving PM2 process list..."

            pm2 save


            # =================================
            # PM2 STATUS
            # =================================

            echo "========================================="
            echo "PM2 STATUS"
            echo "========================================="

            pm2 status


            # =================================
            # WAIT FOR APPLICATION
            # =================================

            echo "Waiting for application..."

            sleep 5


            # =================================
            # HEALTH CHECK
            # =================================

            echo "========================================="
            echo "HEALTH CHECK"
            echo "========================================="

            HTTP_STATUS=$(curl \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              http://localhost:5000/api/health || true)

            echo "HTTP Status: $HTTP_STATUS"


            if [ "$HTTP_STATUS" = "200" ]; then

              echo "SUCCESS: Health check passed."

            else

              echo "WARNING: Health check returned HTTP $HTTP_STATUS"

              echo "Checking PM2 status..."

              pm2 status

              echo "Checking PM2 logs..."

              pm2 logs backend-api --lines 20 --nostream

            fi


            # =================================
            # DEPLOYMENT FINISHED
            # =================================

            echo "========================================="
            echo "DEPLOYMENT FINISHED"
            echo "Time: $(date)"
            echo "========================================="